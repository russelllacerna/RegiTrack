<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RegiTrack | Student Dashboard</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const navItems = [
        { id: "overview", icon: "▦", label: "Overview" },
        { id: "new-request", icon: "+", label: "New Request" },
        { id: "my-requests", icon: "▤", label: "My Requests" },
      ];
      document.getElementById("root").innerHTML = commonShell(
        "Student",
        navItems,
      );
      const user = requireRole(["student"]);
      if (user) {
        shellSetup(
          user,
          "Student Dashboard",
          "Submit and monitor academic document requests",
        );
        renderStudent();
      }
      async function renderStudent() {
        const c = document.getElementById("appContent");
        let me, types, mine;
        try {
          [me, types, mine] = await Promise.all([
            api("me.php"),
            api("document_types.php").then((x) => x.documentTypes),
            api("requests.php").then((x) => x.requests),
          ]);
        } catch (err) {
          c.innerHTML = `<div class="notice warn">${escapeHtml(err.message)}</div>`;
          return;
        }
        const p = me.profile || {};
        c.innerHTML = `
<section data-view="overview"><div class="page-heading"><div><h2>Hello, ${escapeHtml(me.user.name)}</h2><p>Request academic documents and check progress without repeated status inquiries.</p></div><button class="btn primary" data-jump="new-request">+ New request</button></div>
<div class="notice">Development environment: use fictional information only. Do not enter real student data.</div>
<div class="grid stats">${statCard("My requests", mine.length, "All your requests", "R")}${statCard("In progress", mine.filter((r) => !["Released", "Rejected", "Approved for Release"].includes(r.status)).length, "Currently open", "P")}${statCard("Ready for release", mine.filter((r) => ["Ready for Release", "Approved for Release"].includes(r.status)).length, "Check release instructions", "✓")}${statCard("Released", mine.filter((r) => r.status === "Released").length, "Completed requests", "D")}</div>
<section class="panel"><div class="panel-head"><div><h3>Recent requests</h3><p>Your request status and reference numbers</p></div><button class="btn" data-jump="my-requests">View all</button></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Document</th><th>Date submitted</th><th>Status</th><th>Release date</th></tr></thead><tbody>${studentRows(mine.slice(0, 5), false)}</tbody></table></div></section></section>
<section data-view="new-request" class="hidden"><div class="page-heading"><div><h2>Request an academic document</h2><p>Your student details are taken from your registered profile.</p></div></div>
<section class="panel"><div class="panel-head"><div><h3>Request details</h3><p>Required fields are marked with an asterisk.</p></div></div>
<form id="studentRequestForm" class="form-grid"><div class="field"><label for="studentName">Full name</label><input id="studentName" value="${escapeHtml(me.user.name)}" readonly></div><div class="field"><label for="studentNumber">Student number</label><input id="studentNumber" value="${escapeHtml(p.studentNumber || "")}" readonly></div><div class="field"><label for="course">Course / program</label><input id="course" value="${escapeHtml(p.course || "")}" readonly></div><div class="field"><label for="yearAttended">Years attended</label><input id="yearAttended" value="${escapeHtml(p.yearAttended || "")}" readonly></div><div class="field"><label for="documentType">Requested document *</label><select id="documentType" required>${types.map((x) => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join("")}</select></div><div class="field"><label for="purpose">Purpose of request *</label><input id="purpose" maxlength="255" placeholder="Why do you need this document?" required></div><div class="field"><label for="coordinator">Coordinator (graduate school)</label><input id="coordinator" value="${escapeHtml(p.coordinator || "")}" placeholder="Not applicable" readonly></div><div class="field"><label for="supportingFile">Supporting requirement (valid ID or authorization letter)</label><input id="supportingFile" type="file" disabled><span class="hint">Secure file upload will be added in the next sprint (FR3).</span></div><div class="field full"><label for="studentNotes">Additional notes</label><textarea id="studentNotes" maxlength="1000" placeholder="Optional details"></textarea></div><div class="field full"><label><input id="privacyConsent" type="checkbox" required> I agree that the Registrar's Office will process the information in this request to act on it, in accordance with the Data Privacy Act of 2012.</label></div><div class="field full"><button class="btn primary" id="submitRequestBtn" type="submit">Submit request</button></div></form></section></section>
<section data-view="my-requests" class="hidden"><div class="page-heading"><div><h2>My request history</h2><p>Keep your reference number for follow-up.</p></div></div><section class="panel"><div class="panel-head"><h3>All my requests</h3><input id="studentSearch" class="control search" placeholder="Search reference or document"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Document</th><th>Submitted</th><th>Status</th><th>Release date</th><th>Notes from the Registrar</th></tr></thead><tbody id="myRequestRows">${studentRows(mine, true)}</tbody></table></div></section></section>
<p class="footer-note">In-system notifications will be added in a later sprint (FR6). For now, check the status and notes shown here.</p>`;
        document
          .querySelectorAll("[data-jump]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                document
                  .querySelector('[data-nav="' + b.dataset.jump + '"]')
                  .click()),
          );
        document
          .getElementById("studentRequestForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitRequestBtn");
            btn.disabled = true;
            try {
              const res = await api("requests.php", {
                method: "POST",
                body: {
                  documentTypeId: Number(document.getElementById("documentType").value),
                  purpose: document.getElementById("purpose").value.trim(),
                  notes: document.getElementById("studentNotes").value.trim(),
                  privacyConsent: document.getElementById("privacyConsent").checked,
                },
              });
              await renderStudent();
              document.querySelector('[data-nav="my-requests"]').click();
              showToast("Request submitted. Reference: " + res.reference);
            } catch (err) {
              showToast(err.message);
              btn.disabled = false;
            }
          });
        document
          .getElementById("studentSearch")
          .addEventListener("input", () => {
            const q = document
              .getElementById("studentSearch")
              .value.toLowerCase();
            document.getElementById("myRequestRows").innerHTML = studentRows(
              mine.filter((r) =>
                (r.id + " " + r.document + " " + r.status)
                  .toLowerCase()
                  .includes(q),
              ),
              true,
            );
          });
      }
      function studentRows(rows, withNotes) {
        if (!rows.length)
          return `<tr><td colspan="${withNotes ? 6 : 5}" class="empty">You have no requests yet.</td></tr>`;
        return rows
          .map(
            (r) =>
              `<tr><td><strong>${escapeHtml(r.id)}</strong></td><td>${escapeHtml(r.document)}</td><td>${formatDate(r.submitted)}</td><td>${statusPill(r.status)}</td><td>${formatDate(r.releaseDate)}</td>${withNotes ? `<td>${escapeHtml(r.notes || "—")}</td>` : ""}</tr>`,
          )
          .join("");
      }
    </script>
  </body>
</html>
