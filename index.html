<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegiTrack | Sign in</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">

      <div class="brand">
        <img src="assets/regitrack-logo.png" alt="RegiTrack logo" class="brand-logo" />
        <h1 id="login-title">Welcome to RegiTrack</h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2.2"></rect>
                <path d="m5 7 7 5 7-5"></path>
              </svg>
            </span>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Enter your username"
            />
          </div>
          <p class="field-error" id="usernameError"></p>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="password">Password</label>
          </div>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                <path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
              </svg>
            </span>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
            />

            <button
              type="button"
              class="icon-button password-toggle"
              id="passwordToggle"
              aria-label="Show password"
              title="Show password"
            >
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none">
                <path d="M2.5 12s3.5-5.5 9.5-5.5S21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            </button>
          </div>
          <p class="field-error" id="passwordError"></p>
        </div>

        <div class="options-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe" />
            <span class="custom-check"></span>
            <span>Remember me</span>
          </label>

          <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>

        <div class="form-message" id="formMessage" role="alert" aria-live="polite"></div>

        <button class="login-button" id="loginButton" type="submit">
          <span class="button-text">Login</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider" aria-hidden="true">
        <span></span>
        <strong>or</strong>
        <span></span>
      </div>

      <p class="register-text">
        Don't have an account? <a href="#" id="registerLink">Contact Registrar Staff</a>
      </p>

      <p class="demo-hint">
        Demo accounts: <strong>admin/admin123</strong> · <strong>registrar/registrar123</strong> · <strong>student/student123</strong><br>Approver demo: <strong>approver/approver123</strong>
      </p>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
